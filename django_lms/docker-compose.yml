services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    ports:
      - "6380:6379"

  web:
    build: .

    command: python3 manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery:
    build: .

    command: celery -A config worker -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery-beat:
    build: .

    command: celery -A config beat -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db
      - redis

volumes:
  postgres_data:
